<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin | SRA Robotronics Lab</title>

    <link rel="stylesheet" href="admin.css">

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

    <!-- LOGIN SECTION -->
    <section id="loginSection" class="login-section">

        <div class="login-card">

            <img src="logo.jpg" class="logo" alt="SRA Robotronics Lab">

            <h1>Admin Login</h1>

            <p>Manage your SRA Robotronics Lab store</p>

            <form id="loginForm">

                <input
                    type="email"
                    id="email"
                    placeholder="Admin Email"
                    required
                >

                <input
                    type="password"
                    id="password"
                    placeholder="Password"
                    required
                >

                <button type="submit">
                    Login
                </button>

            </form>

            <p id="loginMessage"></p>

        </div>

    </section>


    <!-- ADMIN DASHBOARD -->
    <section id="adminSection" class="admin-section hidden">

        <!-- HEADER -->
        <header class="admin-header">

            <div>
                <h1>SRA Robotronics Lab</h1>
                <p>Admin Dashboard</p>
            </div>

            <button id="logoutBtn" class="logout-btn">
                Logout
            </button>

        </header>


        <main class="dashboard">

            <!-- ADD PRODUCT -->
            <div class="admin-card">

                <h2>Add New Product</h2>

                <form id="productForm">

                    <label>Product Name</label>

                    <input
                        type="text"
                        id="productName"
                        placeholder="Arduino Nano CH340"
                        required
                    >


                    <label>Description</label>

                    <textarea
                        id="productDescription"
                        placeholder="Product description..."
                    ></textarea>


                    <div class="form-row">

                        <div>
                            <label>Price (BDT)</label>

                            <input
                                type="number"
                                id="productPrice"
                                placeholder="365"
                                min="0"
                                required
                            >
                        </div>


                        <div>
                            <label>Stock</label>

                            <input
                                type="number"
                                id="productStock"
                                placeholder="10"
                                min="0"
                                value="0"
                            >
                        </div>

                    </div>


                    <label>Category</label>

                    <select id="productCategory">

                        <option value="Boards">
                            Development Boards
                        </option>

                        <option value="Sensors">
                            Sensors
                        </option>

                        <option value="Modules">
                            Modules
                        </option>

                        <option value="Motors">
                            Motors
                        </option>

                        <option value="Robotics">
                            Robotics
                        </option>

                        <option value="Accessories">
                            Accessories
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>


                    <label>Product Image</label>

                    <input
                        type="file"
                        id="productImage"
                        accept="image/*"
                    >


                    <div id="imagePreview"></div>


                    <label class="checkbox-label">

                        <input
                            type="checkbox"
                            id="productAvailable"
                            checked
                        >

                        Product is available

                    </label>


                    <button
                        type="submit"
                        class="add-product-btn"
                    >
                        Add Product
                    </button>

                </form>

                <p id="productMessage"></p>

            </div>


            <!-- PRODUCT LIST -->
            <div class="admin-card">

                <div class="products-header">

                    <div>

                        <h2>Your Products</h2>

                        <p>
                            Manage products displayed in your store.
                        </p>

                    </div>

                    <button
                        id="refreshBtn"
                        class="refresh-btn"
                    >
                        Refresh
                    </button>

                </div>


                <div id="productsList">

                    <p class="loading">
                        Loading products...
                    </p>

                </div>

            </div>

        </main>

    </section>


    <script src="admin.js"></script>

</body>
</html>
