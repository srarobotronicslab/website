<section class="admin-card">

    <h2 id="formTitle">
        Add New Product
    </h2>


    <form id="productForm">

        <!-- Hidden product ID used when editing -->
        <input
            type="hidden"
            id="editingProductId"
        >


        <!-- PRODUCT NAME -->

        <div class="form-group">

            <label for="productName">
                Product Name
            </label>

            <input
                type="text"
                id="productName"
                placeholder="Example: Arduino Nano"
                required
            >

        </div>



        <!-- DESCRIPTION -->

        <div class="form-group">

            <label for="productDescription">
                Description
            </label>

            <textarea
                id="productDescription"
                placeholder="Enter product description"
                rows="4"
            ></textarea>

        </div>



        <!-- PRICE + STOCK -->

        <div class="form-row">

            <div class="form-group">

                <label for="productPrice">
                    Price (BDT)
                </label>

                <input
                    type="number"
                    id="productPrice"
                    placeholder="500"
                    min="0"
                    required
                >

            </div>


            <div class="form-group">

                <label for="productStock">
                    Stock
                </label>

                <input
                    type="number"
                    id="productStock"
                    placeholder="10"
                    min="0"
                    value="0"
                    required
                >

            </div>

        </div>



        <!-- CATEGORY -->

        <div class="form-group">

            <label for="productCategory">
                Category
            </label>

            <select id="productCategory">

                <option value="Robotics">
                    Robotics
                </option>

                <option value="Electronics">
                    Electronics
                </option>

                <option value="Arduino">
                    Arduino
                </option>

                <option value="Sensors">
                    Sensors
                </option>

                <option value="Motors">
                    Motors
                </option>

                <option value="Kits">
                    Kits
                </option>

                <option value="Other">
                    Other
                </option>

            </select>

        </div>



        <!-- IMAGE -->

        <div class="form-group">

            <label for="productImage">
                Product Image
            </label>

            <input
                type="file"
                id="productImage"
                accept="image/*"
            >

            <small id="imageHelp">
                Leave empty when editing to keep the current image.
            </small>

        </div>



        <!-- IMAGE PREVIEW -->

        <div
            id="imagePreview"
            class="image-preview"
        ></div>



        <!-- AVAILABILITY -->

        <label class="checkbox-label">

            <input
                type="checkbox"
                id="productAvailable"
                checked
            >

            Product is available

        </label>



        <!-- BUTTONS -->

        <div class="form-actions">

            <button
                type="submit"
                class="primary-btn"
                id="submitProductBtn"
            >
                Add Product
            </button>


            <button
                type="button"
                class="cancel-btn hidden"
                id="cancelEditBtn"
            >
                Cancel Edit
            </button>

        </div>


        <p
            id="productMessage"
            class="message"
        ></p>


    </form>

</section>
